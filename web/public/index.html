<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG · knowledge-store chat</title>
<!-- Production chat UI. Served statically by the NestJS app (main.ts useStaticAssets),
     same origin as POST /query — no CORS, no build step. Renders real cited answers. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F4F4F5;
    --text:#18181B; --text-secondary:#52525B; --text-muted:#A1A1AA;
    --border:#E4E4E7; --accent:#4F46E5; --accent-hover:#4338CA;
    --accent-subtle:#EEF2FF; --info:#475569; --info-subtle:#F1F5F9;
    --success:#16A34A; --danger:#B91C1C; --danger-subtle:#FEF2F2;
    --warn:#B45309; --warn-subtle:#FFFBEB; --warn-border:#FCD34D;
    --shadow-sm:0 1px 2px rgba(0,0,0,.06); --shadow-md:0 4px 12px rgba(0,0,0,.08);
    --shadow-pop:0 8px 24px rgba(0,0,0,.12); --r-sm:6px; --r-md:10px; --r-lg:16px;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  [data-theme="dark"]{
    --bg:#09090B; --surface:#18181B; --surface-2:#27272A;
    --text:#FAFAFA; --text-secondary:#A1A1AA; --text-muted:#71717A;
    --border:#27272A; --accent:#6366F1; --accent-hover:#818CF8;
    --accent-subtle:rgba(99,102,241,.16); --info:#94A3B8; --info-subtle:#1E293B;
    --success:#4ADE80; --danger:#FCA5A5; --danger-subtle:rgba(239,68,68,.12);
    --warn:#FBBF24; --warn-subtle:rgba(245,158,11,.14); --warn-border:rgba(245,158,11,.45);
    --shadow-md:0 4px 12px rgba(0,0,0,.4); --shadow-pop:0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px;
    line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .3s var(--ease), color .3s var(--ease)}
  .app{height:100vh; display:flex; flex-direction:column}
  .app-header{display:flex; align-items:center; justify-content:space-between; padding:12px 18px;
    border-bottom:1px solid var(--border); background:var(--surface); z-index:6}
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:-.01em}
  .logo{width:20px; height:20px; border-radius:6px; background:linear-gradient(135deg,var(--accent),var(--accent-hover)); box-shadow:var(--shadow-sm)}
  .brand small{color:var(--text-muted); font-weight:400}
  .header-actions{display:flex; align-items:center; gap:10px}
  .status-badge{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:500; padding:5px 10px;
    border-radius:999px; border:1px solid var(--border); color:var(--text-secondary); background:var(--surface); transition:opacity .2s var(--ease)}
  .status-badge .dot{width:7px; height:7px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 22%,transparent)}
  .status-badge.off .dot{background:var(--text-muted); box-shadow:none}
  .icon-btn{display:grid; place-items:center; width:34px; height:34px; border-radius:var(--r-md); border:1px solid var(--border);
    background:var(--surface); color:var(--text-secondary); cursor:pointer; font-size:15px;
    transition:transform .12s var(--ease), background .2s var(--ease), color .2s var(--ease)}
  .icon-btn:hover{background:var(--surface-2); color:var(--text)} .icon-btn:active{transform:scale(.94)}
  .icon-btn.on{border-color:var(--accent); color:var(--accent); background:var(--accent-subtle)}

  .body{flex:1; display:grid; grid-template-columns:250px minmax(0,1fr) 330px; min-height:0}
  /* Collapse a sidebar's track when it's hidden — otherwise the remaining
     sidebar inherits the flexible track and blows up to fill the screen.
     The centre column always stays the minmax(0,1fr) track. */
  .body.no-left{grid-template-columns:minmax(0,1fr) 330px}
  .body.no-right{grid-template-columns:250px minmax(0,1fr)}
  .body.no-left.no-right{grid-template-columns:minmax(0,1fr)}
  .sidebar{overflow-y:auto; background:var(--surface); min-height:0}
  .sidebar-left{border-right:1px solid var(--border); padding:14px 12px; display:flex; flex-direction:column; gap:4px}
  .sidebar-right{border-left:1px solid var(--border); padding:16px 16px}
  .sidebar.hide{display:none}
  .new-chat{display:flex; align-items:center; gap:8px; justify-content:center; width:100%; padding:10px;
    font-family:var(--sans); font-weight:600; font-size:14px; color:var(--accent); background:var(--accent-subtle);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); border-radius:var(--r-md); cursor:pointer; margin-bottom:10px}
  .new-chat:active{transform:scale(.98)}
  .side-label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); padding:6px 10px 4px}
  .hist-empty{font-size:13px; color:var(--text-muted); padding:8px 10px}
  .hist-item{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; cursor:pointer;
    color:var(--text-secondary); font-size:14px; transition:background .18s var(--ease), color .18s var(--ease)}
  .hist-item svg{flex:none; width:15px; height:15px; opacity:.7}
  .hist-item span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hist-item:hover{background:var(--surface-2); color:var(--text)}
  .hist-item.active{background:var(--accent-subtle); color:var(--text); font-weight:500}
  .hist-item span{flex:1}
  .hist-del{flex:none; display:grid; place-items:center; width:22px; height:22px; border-radius:6px; border:0; background:transparent;
    color:var(--text-muted); cursor:pointer; opacity:0; transition:opacity .15s var(--ease), background .15s var(--ease), color .15s var(--ease)}
  .hist-item:hover .hist-del,.hist-item.active .hist-del{opacity:1}
  .hist-del:hover{background:var(--danger-subtle); color:var(--danger)}
  .hist-del svg{width:14px; height:14px}

  .center{display:flex; flex-direction:column; min-height:0; min-width:0}
  .conversation{flex:1; overflow-y:auto; padding:24px 20px 8px; scroll-behavior:smooth}
  .thread{max-width:760px; margin:0 auto}
  .msg{margin-bottom:22px}
  .msg .role{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);
    margin-bottom:8px; display:flex; align-items:center; gap:8px}
  .role .dot{width:14px;height:14px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent-hover))}
  .bubble{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:14px 16px; box-shadow:var(--shadow-sm)}
  .msg-user .bubble{background:var(--surface-2)}
  .answer{max-width:68ch}
  .answer h3{font-size:1.15rem; margin:14px 0 6px} .answer h4{font-size:1rem; margin:12px 0 6px}
  .answer p{margin:8px 0} .answer ul{margin:8px 0; padding-left:20px} .answer li{margin:3px 0}
  .answer code{font-family:var(--mono); font-size:.85em; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 5px}
  .answer strong{font-weight:600}
  .answer-meta{display:flex; align-items:center; gap:8px; margin-top:14px}
  .grounded{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--success);
    background:color-mix(in srgb,var(--success) 12%,transparent); padding:4px 9px; border-radius:999px}
  .capability-note{margin-top:12px; font-size:13px; color:var(--info); display:flex; align-items:center; gap:7px}

  .card{border-radius:var(--r-md); padding:13px 15px; display:flex; gap:11px; align-items:flex-start; max-width:68ch}
  .card .ic{flex:none; width:20px; height:20px; margin-top:1px}
  .card-title{font-weight:600; margin-bottom:2px}
  .card-info{background:var(--info-subtle); border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
  .card-info .ic{color:var(--info)} .card-info .card-sub{color:var(--text-secondary)}
  .card-danger{background:var(--danger-subtle); border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
  .card-danger .ic{color:var(--danger)} .card-danger .card-title{color:var(--danger)}
  .retry{margin-top:8px; font-family:var(--sans); font-size:12px; font-weight:600; color:var(--danger);
    background:transparent; border:1px solid color-mix(in srgb,var(--danger) 40%,transparent); border-radius:var(--r-sm); padding:5px 10px; cursor:pointer}

  /* Explicit opt-in: answer from the model's general knowledge (NOT the corpus). */
  .general-btn{margin-top:10px; display:inline-flex; align-items:center; gap:7px; font-family:var(--sans); font-size:13px; font-weight:600;
    color:var(--warn); background:var(--warn-subtle); border:1px solid var(--warn-border); border-radius:var(--r-md); padding:8px 12px; cursor:pointer;
    transition:transform .12s var(--ease), background .2s var(--ease)}
  .general-btn:hover{background:color-mix(in srgb,var(--warn) 16%,transparent)} .general-btn:active{transform:scale(.97)}
  .general-btn:disabled{opacity:.55; cursor:default}
  /* The ungrounded answer is colour-coded amber and clearly labelled non-corpus. */
  .answer-general{border-left:3px solid var(--warn); background:var(--warn-subtle); border-radius:var(--r-md); padding:12px 14px; max-width:68ch}
  .general-badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--warn);
    background:color-mix(in srgb,var(--warn) 14%,transparent); border:1px solid var(--warn-border); padding:4px 9px; border-radius:999px; margin-bottom:10px}
  .general-badge svg{width:13px; height:13px}

  .ref-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .ref-head h2{font-size:14px; font-weight:600; margin:0; letter-spacing:-.01em}
  .ref-count{font-family:var(--mono); font-size:11px; color:var(--text-secondary); background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:2px 8px}
  .ref-empty{margin-top:40px; text-align:center; color:var(--text-muted); font-size:13px; line-height:1.6; padding:0 8px}
  .ref-empty svg{width:26px; height:26px; opacity:.5; margin-bottom:10px}
  .ref-item{border:1px solid var(--border); border-radius:var(--r-md); padding:11px 12px; margin-bottom:10px; background:var(--surface);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease)}
  .ref-item:hover{border-color:var(--accent); box-shadow:var(--shadow-sm)}
  .ref-top{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .ref-num{font-family:var(--mono); font-size:11px; font-weight:600; color:#fff; background:var(--accent); width:18px; height:18px; border-radius:5px; display:grid; place-items:center; flex:none}
  .ref-src{font-family:var(--mono); font-size:12px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ref-quote{font-size:12.5px; line-height:1.5; color:var(--text-secondary); white-space:pre-wrap;
    display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden}
  .ref-divider{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:16px 0 10px}
  .chunk{border:1px dashed var(--border); border-radius:var(--r-md); padding:10px 12px; margin-bottom:10px; opacity:.9}
  .chunk-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:7px}
  .chunk-src{font-family:var(--mono); font-size:12px; color:var(--text-secondary)}
  .chunk-score{font-family:var(--mono); font-size:12px; color:var(--text-muted)}
  .bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden}
  .bar > i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent-hover)); transition:width .7s var(--ease)}

  .thinking{display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:14px}
  .dots{display:inline-flex; gap:4px}
  .dots i{width:6px; height:6px; border-radius:50%; background:var(--text-muted); animation:bounce 1.2s var(--ease) infinite}
  .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
  .skeleton{margin-top:10px; height:12px; border-radius:6px; max-width:60ch;
    background:linear-gradient(90deg,var(--surface-2) 25%, color-mix(in srgb,var(--surface-2) 40%,var(--border)) 37%, var(--surface-2) 63%);
    background-size:400% 100%; animation:shimmer 1.4s ease infinite}
  .skeleton.s2{max-width:52ch; margin-top:8px} .skeleton.s3{max-width:38ch; margin-top:8px}

  .empty{text-align:center; margin:12vh auto 0; max-width:520px; animation:rise .4s var(--ease) both}
  .empty h1{font-size:26px; letter-spacing:-.02em; margin:0 0 8px}
  .empty p{color:var(--text-secondary); margin:0 0 22px}
  .examples{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  .chip{font-size:13px; padding:9px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-secondary); cursor:pointer;
    transition:transform .12s var(--ease), border-color .2s var(--ease), color .2s var(--ease)}
  .chip:hover{border-color:var(--accent); color:var(--text); transform:translateY(-1px)}

  .composer-wrap{border-top:1px solid var(--border); padding:14px 20px 18px; background:var(--bg)}
  .composer-inner{max-width:760px; margin:0 auto}
  .composer{display:flex; gap:10px; align-items:flex-end}
  .composer textarea{flex:1; resize:none; font-family:var(--sans); font-size:15px; line-height:1.5; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:12px 14px; min-height:48px; max-height:140px; outline:none;
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease)}
  .composer textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-subtle)}
  /* Theme-matched scrollbars — the default white track clashes with the surface. */
  .composer textarea,.conversation,.sidebar{scrollbar-width:thin; scrollbar-color:var(--border) transparent}
  .composer textarea::-webkit-scrollbar,.conversation::-webkit-scrollbar,.sidebar::-webkit-scrollbar{width:10px; height:10px}
  .composer textarea::-webkit-scrollbar-track,.conversation::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track{background:transparent}
  .composer textarea::-webkit-scrollbar-thumb,.conversation::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{
    background:var(--border); border-radius:999px; border:3px solid var(--surface)}
  .composer textarea::-webkit-scrollbar-thumb:hover,.conversation::-webkit-scrollbar-thumb:hover,.sidebar::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
  .composer textarea::-webkit-scrollbar-thumb{border-color:var(--surface)}
  .ask{display:inline-flex; align-items:center; gap:7px; font-family:var(--sans); font-weight:600; font-size:14px; padding:12px 18px; border-radius:var(--r-md);
    border:0; cursor:pointer; color:#fff; background:var(--accent); box-shadow:var(--shadow-sm); transition:transform .12s var(--ease), background .2s var(--ease)}
  .ask:hover{background:var(--accent-hover)} .ask:active{transform:scale(.96)} .ask:disabled{opacity:.5; cursor:default}
  .hint{margin-top:8px; font-size:12px; color:var(--text-muted); text-align:right}
  kbd{font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 5px}

  .enter{animation:rise .32s var(--ease) both}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.5} 30%{transform:translateY(-5px); opacity:1}}
  @keyframes shimmer{0%{background-position:100% 0} 100%{background-position:0 0}}
  @media (max-width:1080px){ .body{grid-template-columns:250px minmax(0,1fr)} .sidebar-right{display:none} }
  @media (max-width:800px){ .body{grid-template-columns:minmax(0,1fr)} .sidebar-left{display:none} .hint{display:none} }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand"><button class="icon-btn" id="toggleLeft" title="Toggle history">☰</button><span class="logo"></span> RAG <small>· knowledge-store chat</small></div>
    <div class="header-actions">
      <span class="status-badge" id="statusBadge"><span class="dot"></span> grounded citations</span>
      <button class="icon-btn" id="toggleRight" title="Toggle references">⧉</button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar sidebar-left" id="sidebarLeft">
      <button class="new-chat" id="newChat">＋ New chat</button>
      <div class="side-label">History</div>
      <div id="history"><div class="hist-empty">No questions yet.</div></div>
    </aside>
    <main class="center">
      <div class="conversation" id="conversation" aria-live="polite">
        <div class="thread" id="thread"><div class="empty" id="empty">
          <h1>Ask your corpus anything</h1>
          <p>Grounded, cited answers over the ingested documents — and an honest “not in the corpus” when there’s no support.</p>
          <div class="examples">
            <button class="chip">How is retrieval scored?</button>
            <button class="chip">Which Claude model is used for answer generation?</button>
            <button class="chip">What is the capital of France?</button>
          </div>
        </div></div>
      </div>
      <div class="composer-wrap"><div class="composer-inner">
        <div class="composer">
          <textarea id="composer" rows="1" placeholder="Ask a question about the corpus…"></textarea>
          <button class="ask" id="ask">Ask →</button>
        </div>
        <div class="hint"><kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd> to send</div>
      </div></div>
    </main>
    <aside class="sidebar sidebar-right" id="sidebarRight">
      <div class="ref-head"><h2>References</h2><span class="ref-count" id="refCount">0</span></div>
      <div id="refList"></div>
    </aside>
  </div>
</div>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const conv=$('#conversation'), thread=$('#thread'), composer=$('#composer'), ask=$('#ask'),
        badge=$('#statusBadge'), refList=$('#refList'), refCount=$('#refCount'), historyEl=$('#history');
  const escapeHtml=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const scrollDown=()=>{conv.scrollTop=conv.scrollHeight;};
  const el=html=>{const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild;};

  // minimal, safe markdown: escape first, then a limited transform set
  function mdToHtml(raw){
    const esc=escapeHtml(raw).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
    return esc.split(/\n{2,}/).map(block=>{
      const t=block.trim(); if(!t) return '';
      if(/^###\s+/.test(t)) return '<h4>'+t.replace(/^###\s+/,'')+'</h4>';
      if(/^##\s+/.test(t)) return '<h3>'+t.replace(/^##\s+/,'')+'</h3>';
      if(/^#\s+/.test(t)) return '<h3>'+t.replace(/^#\s+/,'')+'</h3>';
      if(t.split('\n').every(l=>/^[-*]\s+/.test(l.trim())))
        return '<ul>'+t.split('\n').map(l=>'<li>'+l.trim().replace(/^[-*]\s+/,'')+'</li>').join('')+'</ul>';
      return '<p>'+t.replace(/\n/g,'<br>')+'</p>';
    }).join('');
  }

  const history=[]; let activeIdx=-1; let lastQuestion=null;

  async function fetchQuery(question){ return postQuery('/query',question); }
  async function fetchGeneral(question){ return postQuery('/query/general',question); }
  async function postQuery(url,question){
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    if(!res.ok){ let id=res.headers.get('x-request-id')||''; throw Object.assign(new Error('HTTP '+res.status),{status:res.status,requestId:id}); }
    return res.json();
  }

  function addUser(text){ const e=$('#empty'); e&&e.remove();
    thread.appendChild(el(`<div class="msg msg-user enter"><div class="role">You</div><div class="bubble">${escapeHtml(text)}</div></div>`)); scrollDown(); }
  function addLoading(){ const m=el(`<div class="msg msg-assistant enter"><div class="role"><span class="dot"></span> RAG</div>
      <div class="bubble"><div class="thinking">retrieving &amp; generating <span class="dots"><i></i><i></i><i></i></span></div>
      <div class="skeleton"></div><div class="skeleton s2"></div><div class="skeleton s3"></div></div></div>`);
    thread.appendChild(m); scrollDown(); return m; }

  const warnIcon=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>`;

  function renderResult(r, question){
    let inner;
    if(r.abstained){
      inner=`<div class="card card-info"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
        <div><div class="card-title">Not in the corpus</div><div class="card-sub">${escapeHtml(r.answer||"I don’t have that in the corpus.")}</div>
        <button class="general-btn" data-general>✦ Answer from general knowledge →</button></div></div>`;
    } else if(r.grounded===false){
      // Explicit opt-in, ungrounded answer — colour-coded amber, clearly non-corpus.
      inner=`<div class="answer-general"><div class="general-badge">${warnIcon} General knowledge · not from your corpus</div>
        <div class="answer">${mdToHtml(r.answer||'')}</div></div>`;
    } else {
      const cites=(r.citations||[]).length;
      const meta = cites>0 ? `<div class="answer-meta"><span class="grounded">✓ grounded · ${cites} citation${cites===1?'':'s'}</span></div>`
        : (r.citationsSupported===false ? `<div class="capability-note">ⓘ configured generation provider does not support citations</div>` : '');
      inner=`<div class="answer">${mdToHtml(r.answer||'')}</div>${meta}`;
    }
    const msg=el(`<div class="msg msg-assistant enter"><div class="role"><span class="dot"></span> RAG</div><div class="bubble">${inner}</div></div>`);
    thread.appendChild(msg);
    const gb=msg.querySelector('[data-general]');
    if(gb) gb.addEventListener('click',()=>askGeneral(gb, question||lastQuestion));
    setReferences(r); updateBadge(r); scrollDown();
  }

  // Explicit opt-in: fetch an ungrounded general-knowledge answer for a question
  // the corpus couldn't answer, and append it as a colour-coded non-corpus card.
  async function askGeneral(btn, question){
    if(!question) return;
    btn.disabled=true; btn.textContent='✦ Thinking…';
    const loading=addLoading();
    try{
      const g=await fetchGeneral(question);
      loading.remove();
      renderResult({answer:g.answer, grounded:false, abstained:false, citations:[], chunks:[], citationsSupported:g.citationsSupported}, question);
    }catch(err){ loading.remove(); btn.disabled=false; btn.textContent='✦ Answer from general knowledge →'; renderError(err); }
  }

  function renderError(err){
    const rid = err.requestId ? `<div style="font-family:var(--mono);font-size:12px;color:var(--text-muted);margin-top:6px">trace id: ${escapeHtml(err.requestId)}</div>` : '';
    const m=el(`<div class="msg msg-assistant enter"><div class="role"><span class="dot"></span> RAG</div>
      <div class="bubble"><div class="card card-danger"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <div><div class="card-title">Something went wrong</div><div class="card-sub">Couldn’t reach the query service (${escapeHtml(err.message)}).</div>${rid}
      <button class="retry" id="retryBtn">Retry</button></div></div></div></div>`);
    thread.appendChild(m); scrollDown();
    m.querySelector('#retryBtn').addEventListener('click',()=>{ m.remove(); if(lastQuestion) send(lastQuestion,false); });
  }

  function setReferences(r){
    const cites=r.citations||[], chunks=r.chunks||[];
    if(r.abstained){ refCount.textContent='0'; refList.innerHTML=refEmpty('No sources — the answer isn’t in the corpus.'); return; }
    if(r.grounded===false){ refCount.textContent='0'; refList.innerHTML=refEmpty('Answered from the model’s general knowledge — no corpus sources.'); return; }
    if(cites.length){
      refCount.textContent=cites.length;
      let html=cites.map((c,i)=>`<div class="ref-item enter" style="animation-delay:${i*60}ms">
        <div class="ref-top"><span class="ref-num">${i+1}</span><span class="ref-src">${escapeHtml(c.source)}</span></div>
        <div class="ref-quote">${escapeHtml((c.citedText||'').trim())}</div></div>`).join('');
      const cited=new Set(cites.map(c=>c.documentIndex));
      const extra=chunks.map((c,idx)=>({c,idx})).filter(x=>!cited.has(x.idx));
      if(extra.length) html+=`<div class="ref-divider">Also retrieved</div>`+extra.map(({c})=>chunkCard(c)).join('');
      refList.innerHTML=html;
    } else {
      refCount.textContent=chunks.length;
      refList.innerHTML=(r.citationsSupported===false?`<div class="capability-note" style="margin:0 0 12px">ⓘ provider can’t cite — showing retrieved context</div>`:'')
        + (chunks.length?chunks.map(chunkCard).join(''):refEmpty('No retrieved context.'));
    }
    requestAnimationFrame(()=>refList.querySelectorAll('.bar > i').forEach(b=>b.style.width=b.dataset.w+'%'));
  }
  const refEmpty=msg=>`<div class="ref-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><div>${msg}</div></div>`;
  const chunkCard=c=>`<div class="chunk"><div class="chunk-head"><span class="chunk-src">${escapeHtml(c.source)}</span><span class="chunk-score">${(c.score||0).toFixed(2)}</span></div><div class="bar"><i data-w="${Math.round((c.score||0)*100)}"></i></div></div>`;

  function updateBadge(r){
    if(!r.abstained && r.grounded===false){ badge.className='status-badge off'; badge.innerHTML='<span class="dot" style="background:var(--warn);box-shadow:none"></span> general knowledge'; }
    else if(r.citationsSupported===false){ badge.className='status-badge off'; badge.innerHTML='<span class="dot"></span> citations unsupported'; }
    else { badge.className='status-badge'; badge.innerHTML='<span class="dot"></span> grounded citations'; }
  }

  function renderHistory(){
    if(!history.length){ historyEl.innerHTML='<div class="hist-empty">No questions yet.</div>'; return; }
    historyEl.innerHTML=history.map((h,i)=>`<div class="hist-item ${i===activeIdx?'active':''}" data-h="${i}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>${escapeHtml(h.question)}</span>
      <button class="hist-del" data-del="${i}" title="Delete chat" aria-label="Delete chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m1 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button></div>`).join('');
    historyEl.querySelectorAll('.hist-item').forEach(it=>it.addEventListener('click',()=>{
      const i=+it.dataset.h; activeIdx=i; renderHistory();
      thread.innerHTML=''; addUser(history[i].question); renderResult(history[i].result, history[i].question);
    }));
    historyEl.querySelectorAll('.hist-del').forEach(btn=>btn.addEventListener('click',e=>{ e.stopPropagation(); deleteHistory(+btn.dataset.del); }));
  }

  function deleteHistory(i){
    history.splice(i,1);
    if(activeIdx===i){ activeIdx=-1; showEmpty(); }   // deleting the open chat → back to empty state
    else if(activeIdx>i){ activeIdx--; }               // keep the active pointer aligned after the shift
    renderHistory();
  }

  function showEmpty(){
    thread.innerHTML=`<div class="empty" id="empty"><h1>Ask your corpus anything</h1>
      <p>Grounded, cited answers over the ingested documents — and an honest “not in the corpus” when there’s no support.</p>
      <div class="examples"><button class="chip">How is retrieval scored?</button><button class="chip">Which Claude model is used for answer generation?</button><button class="chip">What is the capital of France?</button></div></div>`;
    refCount.textContent='0'; refList.innerHTML=refEmpty('Citations from the answer will appear here.'); updateBadge({});
  }

  async function send(question, pushToHistory=true){
    ask.disabled=true; lastQuestion=question; addUser(question);
    const loading=addLoading();
    try{
      const r=await fetchQuery(question);
      loading.remove(); renderResult(r, question);
      if(pushToHistory){ history.unshift({question,result:r}); activeIdx=0; renderHistory(); }
    }catch(err){ loading.remove(); renderError(err); }
    finally{ ask.disabled=false; }
  }

  function submit(){ const q=composer.value.trim(); if(!q) return; composer.value=''; autosize(); send(q); }
  ask.addEventListener('click',submit);
  composer.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); submit(); } });
  function autosize(){ composer.style.height='auto'; composer.style.height=Math.min(composer.scrollHeight,140)+'px'; }
  composer.addEventListener('input',autosize);
  document.addEventListener('click',e=>{ const chip=e.target.closest('.chip'); if(chip){ composer.value=chip.textContent; submit(); } });

  $('#newChat').addEventListener('click',()=>{ activeIdx=-1; renderHistory(); showEmpty(); });
  const bodyEl=$('.body');
  $('#toggleLeft').addEventListener('click',function(){ const hidden=$('#sidebarLeft').classList.toggle('hide'); bodyEl.classList.toggle('no-left',hidden); this.classList.toggle('on'); });
  $('#toggleRight').addEventListener('click',function(){ const hidden=$('#sidebarRight').classList.toggle('hide'); bodyEl.classList.toggle('no-right',hidden); this.classList.toggle('on'); });
  $('#themeToggle').addEventListener('click',()=>{ const h=document.documentElement; h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark'); });
  if(window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.setAttribute('data-theme','dark');

  refList.innerHTML=refEmpty('Citations from the answer will appear here.');
})();
</script>
</body>
</html>
