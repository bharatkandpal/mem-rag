<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../styles.css"/><title>Colors</title></head>
<body><div class="preview">
  <div class="pv-label">Color tokens · light theme</div>
  <div class="swatches">
    <div class="swatch"><div class="chip-color" style="background:var(--accent)"></div><div class="meta"><div class="name">accent</div><div class="hex">#4F46E5</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--accent-hover)"></div><div class="meta"><div class="name">accent-hover</div><div class="hex">#4338CA</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--accent-subtle)"></div><div class="meta"><div class="name">accent-subtle</div><div class="hex">#EEF2FF</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--bg)"></div><div class="meta"><div class="name">bg</div><div class="hex">#FAFAFA</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--surface)"></div><div class="meta"><div class="name">surface</div><div class="hex">#FFFFFF</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--surface-2)"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#F4F4F5</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--text)"></div><div class="meta"><div class="name">text</div><div class="hex">#18181B</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--text-secondary)"></div><div class="meta"><div class="name">text-secondary</div><div class="hex">#52525B</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--border)"></div><div class="meta"><div class="name">border</div><div class="hex">#E4E4E7</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--info)"></div><div class="meta"><div class="name">info · abstain</div><div class="hex">#475569</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--success)"></div><div class="meta"><div class="name">success</div><div class="hex">#16A34A</div></div></div>
    <div class="swatch"><div class="chip-color" style="background:var(--danger)"></div><div class="meta"><div class="name">danger</div><div class="hex">#B91C1C</div></div></div>
  </div>
</div></body></html>
