<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG · design prototype</title>
<!--
  DESIGN-EVALUATION SPIKE — not the production build.
  Three-pane layout: left = chat history, center = conversation, right = citation references.
  Mock /query data, no backend. Embodies docs/ui-design-guide.md; CSS vars + keyframes port
  into the eventual React + Vite app (GO-21e, gated on RAG-63).
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ---- tokens (docs/ui-design-guide.md §3) ---- */
  :root{
    --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F4F4F5;
    --text:#18181B; --text-secondary:#52525B; --text-muted:#A1A1AA;
    --border:#E4E4E7; --accent:#4F46E5; --accent-hover:#4338CA;
    --accent-subtle:#EEF2FF; --info:#475569; --info-subtle:#F1F5F9;
    --success:#16A34A; --danger:#B91C1C; --danger-subtle:#FEF2F2;
    --shadow-sm:0 1px 2px rgba(0,0,0,.06); --shadow-md:0 4px 12px rgba(0,0,0,.08);
    --shadow-pop:0 8px 24px rgba(0,0,0,.12); --r-sm:6px; --r-md:10px; --r-lg:16px;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  [data-theme="dark"]{
    --bg:#09090B; --surface:#18181B; --surface-2:#27272A;
    --text:#FAFAFA; --text-secondary:#A1A1AA; --text-muted:#71717A;
    --border:#27272A; --accent:#6366F1; --accent-hover:#818CF8;
    --accent-subtle:rgba(99,102,241,.16); --info:#94A3B8; --info-subtle:#1E293B;
    --success:#4ADE80; --danger:#FCA5A5; --danger-subtle:rgba(239,68,68,.12);
    --shadow-md:0 4px 12px rgba(0,0,0,.4); --shadow-pop:0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px;
    line-height:1.6; -webkit-font-smoothing:antialiased;
    transition:background .3s var(--ease), color .3s var(--ease)}
  .app{height:100vh; display:flex; flex-direction:column}

  /* ---- header ---- */
  .app-header{display:flex; align-items:center; justify-content:space-between; padding:12px 18px;
    border-bottom:1px solid var(--border); background:var(--surface); z-index:6}
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:-.01em}
  .logo{width:20px; height:20px; border-radius:6px; background:linear-gradient(135deg,var(--accent),var(--accent-hover)); box-shadow:var(--shadow-sm)}
  .brand small{color:var(--text-muted); font-weight:400}
  .header-actions{display:flex; align-items:center; gap:10px}
  .status-badge{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:500;
    padding:5px 10px; border-radius:999px; border:1px solid var(--border);
    color:var(--text-secondary); background:var(--surface); transition:opacity .2s var(--ease)}
  .status-badge .dot{width:7px; height:7px; border-radius:50%; background:var(--success);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 22%,transparent)}
  .icon-btn{display:grid; place-items:center; width:34px; height:34px; border-radius:var(--r-md);
    border:1px solid var(--border); background:var(--surface); color:var(--text-secondary); cursor:pointer;
    font-size:15px; transition:transform .12s var(--ease), background .2s var(--ease), color .2s var(--ease)}
  .icon-btn:hover{background:var(--surface-2); color:var(--text)} .icon-btn:active{transform:scale(.94)}
  .icon-btn.on{border-color:var(--accent); color:var(--accent); background:var(--accent-subtle)}

  /* ---- 3-pane body ---- */
  .body{flex:1; display:grid; grid-template-columns:250px minmax(0,1fr) 330px; min-height:0}
  .sidebar{overflow-y:auto; background:var(--surface); min-height:0}
  .sidebar-left{border-right:1px solid var(--border); padding:14px 12px; display:flex; flex-direction:column; gap:4px}
  .sidebar-right{border-left:1px solid var(--border); padding:16px 16px}
  .sidebar.hide{display:none}

  /* ---- left: chat history ---- */
  .new-chat{display:flex; align-items:center; gap:8px; justify-content:center; width:100%; padding:10px;
    font-family:var(--sans); font-weight:600; font-size:14px; color:var(--accent);
    background:var(--accent-subtle); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    border-radius:var(--r-md); cursor:pointer; margin-bottom:10px;
    transition:transform .12s var(--ease), background .2s var(--ease)}
  .new-chat:hover{background:color-mix(in srgb,var(--accent-subtle) 60%,var(--accent))} .new-chat:active{transform:scale(.98)}
  .side-label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-muted); padding:6px 10px 4px}
  .hist-item{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; cursor:pointer;
    color:var(--text-secondary); font-size:14px; transition:background .18s var(--ease), color .18s var(--ease)}
  .hist-item svg{flex:none; width:15px; height:15px; opacity:.7}
  .hist-item span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hist-item:hover{background:var(--surface-2); color:var(--text)}
  .hist-item.active{background:var(--accent-subtle); color:var(--text); font-weight:500}

  /* ---- center ---- */
  .center{display:flex; flex-direction:column; min-height:0; min-width:0}
  .conversation{flex:1; overflow-y:auto; padding:24px 20px 8px; scroll-behavior:smooth}
  .thread{max-width:760px; margin:0 auto}
  .msg{margin-bottom:22px}
  .msg .role{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-muted); margin-bottom:8px; display:flex; align-items:center; gap:8px}
  .role .dot{width:14px;height:14px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent-hover))}
  .bubble{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:14px 16px; box-shadow:var(--shadow-sm)}
  .msg-user .bubble{background:var(--surface-2)}
  .answer .cited{background:linear-gradient(transparent 62%, var(--accent-subtle) 0); padding-bottom:1px; border-radius:2px}
  sup{line-height:0}
  .cite{font-family:var(--mono); font-size:11px; font-weight:600; vertical-align:super; margin-left:2px;
    min-width:16px; height:16px; padding:0 4px; border-radius:5px;
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent); color:var(--accent);
    background:var(--accent-subtle); cursor:pointer; transition:transform .12s var(--ease), background .15s var(--ease)}
  .cite:hover,.cite.lit{background:var(--accent); color:#fff; transform:translateY(-1px)}
  .cite:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .answer-meta{display:flex; align-items:center; gap:8px; margin-top:12px}
  .grounded{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    color:var(--success); background:color-mix(in srgb,var(--success) 12%,transparent); padding:4px 9px; border-radius:999px}
  .capability-note{margin-top:12px; font-size:13px; color:var(--info); display:flex; align-items:center; gap:7px}

  /* ---- cards (abstain / error) ---- */
  .card{border-radius:var(--r-md); padding:13px 15px; display:flex; gap:11px; align-items:flex-start}
  .card .ic{flex:none; width:20px; height:20px; margin-top:1px}
  .card-title{font-weight:600; margin-bottom:2px}
  .card-info{background:var(--info-subtle); border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
  .card-info .ic{color:var(--info)} .card-info .card-sub{color:var(--text-secondary)}
  .card-danger{background:var(--danger-subtle); border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
  .card-danger .ic{color:var(--danger)} .card-danger .card-title{color:var(--danger)}
  .card .trace{font-family:var(--mono); font-size:12px; color:var(--text-muted); margin-top:6px}

  /* ---- right: references ---- */
  .ref-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .ref-head h2{font-size:14px; font-weight:600; margin:0; letter-spacing:-.01em}
  .ref-count{font-family:var(--mono); font-size:11px; color:var(--text-secondary); background:var(--surface-2);
    border:1px solid var(--border); border-radius:999px; padding:2px 8px}
  .ref-empty{margin-top:40px; text-align:center; color:var(--text-muted); font-size:13px; line-height:1.6; padding:0 8px}
  .ref-empty svg{width:26px; height:26px; opacity:.5; margin-bottom:10px}
  .ref-item{border:1px solid var(--border); border-radius:var(--r-md); padding:11px 12px; margin-bottom:10px;
    cursor:pointer; background:var(--surface);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease), transform .12s var(--ease)}
  .ref-item:hover{border-color:var(--accent); box-shadow:var(--shadow-sm)}
  .ref-item.active{border-color:var(--accent); background:var(--accent-subtle)}
  .ref-top{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .ref-num{font-family:var(--mono); font-size:11px; font-weight:600; color:#fff; background:var(--accent);
    width:18px; height:18px; border-radius:5px; display:grid; place-items:center; flex:none}
  .ref-src{font-family:var(--mono); font-size:12px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ref-quote{font-size:13px; line-height:1.5; color:var(--text-secondary)}
  .ref-quote::before{content:'“'} .ref-quote::after{content:'”'}
  .ref-divider{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-muted); margin:16px 0 10px}
  .chunk{border:1px dashed var(--border); border-radius:var(--r-md); padding:10px 12px; margin-bottom:10px; opacity:.85}
  .chunk-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:7px}
  .chunk-src{font-family:var(--mono); font-size:12px; color:var(--text-secondary)}
  .chunk-score{font-family:var(--mono); font-size:12px; color:var(--text-muted)}
  .bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden}
  .bar > i{display:block; height:100%; width:0; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-hover)); transition:width .7s var(--ease)}

  /* ---- loading ---- */
  .thinking{display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:14px}
  .dots{display:inline-flex; gap:4px}
  .dots i{width:6px; height:6px; border-radius:50%; background:var(--text-muted); animation:bounce 1.2s var(--ease) infinite}
  .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
  .skeleton{margin-top:10px; height:12px; border-radius:6px; max-width:60ch;
    background:linear-gradient(90deg,var(--surface-2) 25%, color-mix(in srgb,var(--surface-2) 40%,var(--border)) 37%, var(--surface-2) 63%);
    background-size:400% 100%; animation:shimmer 1.4s ease infinite}
  .skeleton.s2{max-width:52ch; margin-top:8px} .skeleton.s3{max-width:38ch; margin-top:8px}
  .caret{display:inline-block; width:2px; height:1.05em; background:var(--accent); vertical-align:-2px; margin-left:2px; animation:blink 1s steps(1) infinite}

  /* ---- empty ---- */
  .empty{text-align:center; margin:12vh auto 0; max-width:520px; animation:rise .4s var(--ease) both}
  .empty h1{font-size:26px; letter-spacing:-.02em; margin:0 0 8px}
  .empty p{color:var(--text-secondary); margin:0 0 22px}
  .examples{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  .chip{font-size:13px; padding:9px 13px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-secondary); cursor:pointer;
    transition:transform .12s var(--ease), border-color .2s var(--ease), color .2s var(--ease)}
  .chip:hover{border-color:var(--accent); color:var(--text); transform:translateY(-1px)}

  /* ---- composer ---- */
  .composer-wrap{border-top:1px solid var(--border); padding:14px 20px 18px; background:var(--bg)}
  .composer-inner{max-width:760px; margin:0 auto}
  .demo-toolbar{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
  .demo-toolbar span{font-size:12px; color:var(--text-muted)}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--surface)}
  .seg button{font-family:var(--sans); font-size:12px; padding:6px 11px; border:0; background:transparent;
    color:var(--text-secondary); cursor:pointer; transition:background .2s var(--ease), color .2s var(--ease)}
  .seg button + button{border-left:1px solid var(--border)}
  .seg button.active{background:var(--accent); color:#fff}
  .composer{display:flex; gap:10px; align-items:flex-end}
  .composer textarea{flex:1; resize:none; font-family:var(--sans); font-size:15px; line-height:1.5; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:12px 14px;
    min-height:48px; max-height:140px; outline:none; transition:border-color .2s var(--ease), box-shadow .2s var(--ease)}
  .composer textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-subtle)}
  .ask{display:inline-flex; align-items:center; gap:7px; font-family:var(--sans); font-weight:600; font-size:14px;
    padding:12px 18px; border-radius:var(--r-md); border:0; cursor:pointer; color:#fff; background:var(--accent);
    box-shadow:var(--shadow-sm); transition:transform .12s var(--ease), background .2s var(--ease)}
  .ask:hover{background:var(--accent-hover)} .ask:active{transform:scale(.96)} .ask:disabled{opacity:.5; cursor:default}
  .hint{margin-top:8px; font-size:12px; color:var(--text-muted); text-align:right}
  kbd{font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 5px}

  /* ---- popover ---- */
  .popover{position:fixed; z-index:20; max-width:320px; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow-pop); padding:12px 14px;
    opacity:0; transform:scale(.94) translateY(4px); pointer-events:none;
    transition:opacity .15s var(--ease), transform .15s var(--ease)}
  .popover.show{opacity:1; transform:scale(1) translateY(0); pointer-events:auto}
  .popover .pv-src{font-family:var(--mono); font-size:11px; color:var(--accent); margin-bottom:6px}
  .popover .pv-quote{font-size:13px; line-height:1.5; color:var(--text-secondary)}
  .popover .pv-quote::before{content:'“'} .popover .pv-quote::after{content:'”'}

  .enter{animation:rise .32s var(--ease) both}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.5} 30%{transform:translateY(-5px); opacity:1}}
  @keyframes shimmer{0%{background-position:100% 0} 100%{background-position:0 0}}
  @keyframes blink{50%{opacity:0}}

  @media (max-width:1080px){ .body{grid-template-columns:250px minmax(0,1fr)} .sidebar-right{display:none} }
  @media (max-width:800px){ .body{grid-template-columns:minmax(0,1fr)} .sidebar-left{display:none} .hint{display:none} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
    .caret{animation:none}
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <button class="icon-btn" id="toggleLeft" title="Toggle history" aria-label="Toggle history">☰</button>
      <span class="logo"></span> RAG <small>· knowledge-store chat</small>
    </div>
    <div class="header-actions">
      <span class="status-badge" id="statusBadge"><span class="dot"></span> citations on · claude-opus-4-8</span>
      <button class="icon-btn" id="toggleRight" title="Toggle references" aria-label="Toggle references">⧉</button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="body">
    <!-- LEFT: chat history -->
    <aside class="sidebar sidebar-left" id="sidebarLeft">
      <button class="new-chat" id="newChat">＋ New chat</button>
      <div class="side-label">Recent</div>
      <div id="history"></div>
    </aside>

    <!-- CENTER: conversation -->
    <main class="center">
      <div class="conversation" id="conversation" aria-live="polite">
        <div class="thread" id="thread">
          <div class="empty" id="empty">
            <h1>Ask your corpus anything</h1>
            <p>Grounded, cited answers over your documents — and an honest “not in the corpus” when there’s no support.</p>
            <div class="examples">
              <button class="chip">How is retrieval scored?</button>
              <button class="chip">What sets the quality bar?</button>
              <button class="chip">What’s the capital of France?</button>
            </div>
          </div>
        </div>
      </div>
      <div class="composer-wrap"><div class="composer-inner">
        <div class="demo-toolbar">
          <span>Preview state:</span>
          <div class="seg" id="seg">
            <button data-state="grounded" class="active">Grounded</button>
            <button data-state="abstain">Abstain</button>
            <button data-state="uncited">Uncited</button>
            <button data-state="error">Error</button>
          </div>
        </div>
        <div class="composer">
          <textarea id="composer" rows="1" placeholder="Ask a question about the corpus…"></textarea>
          <button class="ask" id="ask">Ask →</button>
        </div>
        <div class="hint"><kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd> to send</div>
      </div></div>
    </main>

    <!-- RIGHT: citation references -->
    <aside class="sidebar sidebar-right" id="sidebarRight">
      <div class="ref-head"><h2>References</h2><span class="ref-count" id="refCount">0</span></div>
      <div id="refList"></div>
    </aside>
  </div>
</div>

<div class="popover" id="popover" role="tooltip">
  <div class="pv-src" id="pvSrc"></div>
  <div class="pv-quote" id="pvQuote"></div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const conv=$('#conversation'), thread=$('#thread'), composer=$('#composer'), ask=$('#ask'),
        popover=$('#popover'), badge=$('#statusBadge'), refList=$('#refList'), refCount=$('#refCount');

  // ---- mock /query responses (the four QueryResult render branches) ----
  const CHUNKS=[
    {source:'TDD.md', score:0.71, content:'embed(query) → pgvector cosine search top-k → return {content, source, score}. k and a min-score floor are config.'},
    {source:'GO-21.md', score:0.58, content:'Retrieval: top-k similarity search (HNSW) with metadata + score. A query returns the relevant chunks with sources, ranked.'},
    {source:'.claude/rules/ai-and-secrets.md', score:0.42, content:'Abstain on empty retrieval. If no chunk clears the score floor, return "not in the corpus" — never free-generate an answer.'}
  ];
  const GROUNDED={ abstained:false, citationsSupported:true, chunks:CHUNKS,
    answerHTML:
      'Retrieval scores each chunk by <span class="cited">cosine similarity over an HNSW index<sup><button class="cite" data-idx="0">1</button></sup></span>, '+
      'then applies a <span class="cited">configurable min-score floor<sup><button class="cite" data-idx="1">2</button></sup></span> so weak matches drop out. '+
      'Chunks that clear the floor are ranked by score and passed to generation; if none clear it, the system '+
      '<span class="cited">abstains rather than answer ungrounded<sup><button class="cite" data-idx="2">3</button></sup></span>.',
    citations:[
      {documentIndex:0, source:'TDD.md', citedText:'embed(query) → pgvector cosine search top-k over the HNSW index.'},
      {documentIndex:0, source:'TDD.md', citedText:'k and a min-score floor are config (RAG-22, MIN_SCORE).'},
      {documentIndex:2, source:'.claude/rules/ai-and-secrets.md', citedText:'If no chunk clears the score floor, return "not in the corpus" — never free-generate.'}
    ] };
  const UNCITED={ abstained:false, citationsSupported:false, chunks:CHUNKS, citations:[],
    answerHTML:'Retrieval ranks chunks by cosine similarity over the HNSW index and drops anything below the min-score floor before generation.' };
  const ABSTAIN={ abstained:true, citationsSupported:true, chunks:[], citations:[], answer:"I don’t have that in the corpus." };
  const ERROR={ error:true, correlationId:'req_8f2a…c7' };
  const STATES={grounded:GROUNDED, uncited:UNCITED, abstain:ABSTAIN, error:ERROR};
  const pickState=text=>{const t=(text||'').toLowerCase();
    if(/capital|france|weather|stock/.test(t))return 'abstain'; if(/error|fail|500/.test(t))return 'error'; return 'grounded';};

  // ---- history (mock) ----
  const HISTORY=[
    {title:'How is retrieval scored?', q:'How is retrieval scored?', state:'grounded'},
    {title:'What sets the quality bar?', q:'What sets the quality bar?', state:'grounded'},
    {title:'Capital of France?', q:'What’s the capital of France?', state:'abstain'},
    {title:'Local embeddings option', q:'Can I swap in local embeddings?', state:'uncited'}
  ];
  function renderHistory(activeIdx){
    $('#history').innerHTML = HISTORY.map((h,i)=>`
      <div class="hist-item ${i===activeIdx?'active':''}" data-h="${i}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>${escapeHtml(h.title)}</span></div>`).join('');
    document.querySelectorAll('.hist-item').forEach(it=>it.addEventListener('click',()=>{
      const h=HISTORY[+it.dataset.h]; renderHistory(+it.dataset.h); resetThread(); run(h.q, h.state, false);
    }));
  }

  const el=html=>{const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild;};
  const escapeHtml=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const scrollDown=()=>{conv.scrollTop=conv.scrollHeight;};
  let lastAnswer=null;

  function resetThread(){ thread.innerHTML=''; setReferences(null,null); }
  function addUser(text){ const e=$('#empty'); e&&e.remove();
    thread.appendChild(el(`<div class="msg msg-user enter"><div class="role">You</div><div class="bubble">${escapeHtml(text)}</div></div>`)); scrollDown(); }
  function addLoading(){ const m=el(`<div class="msg msg-assistant enter">
      <div class="role"><span class="dot"></span> RAG</div>
      <div class="bubble"><div class="thinking">retrieving &amp; generating <span class="dots"><i></i><i></i><i></i></span></div>
      <div class="skeleton"></div><div class="skeleton s2"></div><div class="skeleton s3"></div></div></div>`);
    thread.appendChild(m); scrollDown(); return m; }

  function renderAssistant(state){
    const d=STATES[state]; let inner='';
    if(state==='error'){
      inner=`<div class="card card-danger"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <div><div class="card-title">Something went wrong</div><div class="card-sub">The query couldn’t be completed. Please retry.</div>
        <div class="trace">trace id: ${d.correlationId}</div></div></div>`;
    } else if(state==='abstain'){
      inner=`<div class="card card-info"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
        <div><div class="card-title">Not in the corpus</div><div class="card-sub">${escapeHtml(d.answer)}</div></div></div>`;
    } else {
      const grounded=d.citations.length>0;
      const meta=grounded?`<div class="answer-meta"><span class="grounded">✓ grounded · ${d.citations.length} citations</span></div>`
        :(d.citationsSupported===false?`<div class="capability-note">ⓘ configured generation provider does not support citations</div>`:'');
      inner=`<div class="answer">${d.answerHTML}<span class="caret" id="caret"></span></div>${meta}`;
    }
    const m=el(`<div class="msg msg-assistant enter"><div class="role"><span class="dot"></span> RAG</div><div class="bubble">${inner}</div></div>`);
    thread.appendChild(m); lastAnswer=(state==='grounded')?m:null; if(m) m._cites=(STATES[state].citations)||[];
    requestAnimationFrame(()=>{ const caret=m.querySelector('#caret'); if(caret) setTimeout(()=>caret.remove(),1400); wireCites(m); });
    setReferences(state, m); scrollDown();
  }

  // ---- right sidebar: references ----
  function setReferences(state, msgEl){
    if(!state){ refCount.textContent='0'; refList.innerHTML=refEmpty('Citations from the answer will appear here.'); return; }
    const d=STATES[state];
    if(state==='abstain'){ refCount.textContent='0'; refList.innerHTML=refEmpty('No sources — the answer isn’t in the corpus.'); return; }
    if(state==='error'){ refCount.textContent='—'; refList.innerHTML=refEmpty('No references for a failed request.'); return; }

    let html='';
    if(d.citations.length){
      refCount.textContent=d.citations.length;
      html+=d.citations.map((c,i)=>`
        <div class="ref-item enter" data-ref="${i}" style="animation-delay:${i*60}ms">
          <div class="ref-top"><span class="ref-num">${i+1}</span><span class="ref-src">${escapeHtml(c.source)}</span></div>
          <div class="ref-quote">${escapeHtml(c.citedText)}</div></div>`).join('');
      const citedDocs=new Set(d.citations.map(c=>c.documentIndex));
      const extra=d.chunks.map((c,idx)=>({c,idx})).filter(x=>!citedDocs.has(x.idx));
      if(extra.length){ html+=`<div class="ref-divider">Also retrieved</div>`+extra.map(({c})=>chunkCard(c)).join(''); }
    } else {
      refCount.textContent=d.chunks.length;
      html=`<div class="capability-note" style="margin:0 0 12px">ⓘ provider can’t cite — showing retrieved context</div>`
        + d.chunks.map(chunkCard).join('');
    }
    refList.innerHTML=html;
    requestAnimationFrame(()=>refList.querySelectorAll('.bar > i').forEach(b=>b.style.width=b.dataset.w+'%'));
    // ref → inline marker cross-link
    refList.querySelectorAll('.ref-item').forEach(r=>r.addEventListener('click',()=>{
      const i=+r.dataset.ref; if(!lastAnswer) return;
      const btn=lastAnswer.querySelector(`.cite[data-idx="${i}"]`); if(!btn) return;
      highlightRef(i); litMarker(btn); btn.scrollIntoView({block:'center',behavior:'smooth'}); showPopover(btn, lastAnswer._cites[i]);
    }));
  }
  const refEmpty=msg=>`<div class="ref-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><div>${msg}</div></div>`;
  const chunkCard=c=>`<div class="chunk"><div class="chunk-head"><span class="chunk-src">${escapeHtml(c.source)}</span><span class="chunk-score">${c.score.toFixed(2)}</span></div>
      <div class="bar"><i data-w="${Math.round(c.score*100)}"></i></div></div>`;
  function highlightRef(i){ refList.querySelectorAll('.ref-item').forEach(x=>x.classList.remove('active'));
    const r=refList.querySelector(`.ref-item[data-ref="${i}"]`); if(r) r.classList.add('active'); }
  function litMarker(btn){ document.querySelectorAll('.cite.lit').forEach(x=>x.classList.remove('lit')); btn.classList.add('lit'); }

  function wireCites(m){
    m.querySelectorAll('.cite').forEach(btn=>btn.addEventListener('click',e=>{
      e.stopPropagation(); const i=+btn.dataset.idx; const c=m._cites[i];
      showPopover(btn,c); litMarker(btn); highlightRef(i);
    }));
  }

  function showPopover(anchor,c){
    if(!c) return; $('#pvSrc').textContent=c.source; $('#pvQuote').textContent=c.citedText;
    popover.classList.add('show'); const r=anchor.getBoundingClientRect(), pw=popover.offsetWidth, ph=popover.offsetHeight;
    let left=Math.min(Math.max(8, r.left+r.width/2-pw/2), window.innerWidth-pw-8);
    let top=r.top-ph-8; if(top<8) top=r.bottom+8; popover.style.left=left+'px'; popover.style.top=top+'px';
  }
  document.addEventListener('click',e=>{ if(!e.target.closest('.cite')&&!e.target.closest('.popover')&&!e.target.closest('.ref-item')){
    popover.classList.remove('show'); document.querySelectorAll('.cite.lit').forEach(x=>x.classList.remove('lit')); } });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') popover.classList.remove('show'); });

  // ---- flow ----
  function run(text,state,pushUser=true){ ask.disabled=true; if(pushUser&&text) addUser(text);
    else if(text){ const e=$('#empty'); e&&e.remove(); thread.appendChild(el(`<div class="msg msg-user enter"><div class="role">You</div><div class="bubble">${escapeHtml(text)}</div></div>`)); }
    const loading=addLoading(); setTimeout(()=>{ loading.remove(); renderAssistant(state); ask.disabled=false; }, 950); }
  function submit(){ const text=composer.value.trim(); if(!text) return; composer.value=''; autosize(); run(text, pickState(text)); }
  ask.addEventListener('click', submit);
  composer.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); submit(); } });
  function autosize(){ composer.style.height='auto'; composer.style.height=Math.min(composer.scrollHeight,140)+'px'; }
  composer.addEventListener('input', autosize);
  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{ composer.value=c.textContent; submit(); }));

  // preview-state control
  const SAMPLE={grounded:'How is retrieval scored?', uncited:'Can I swap in local embeddings?', abstain:"What’s the capital of France?", error:'trigger an error'};
  $('#seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    badge.style.opacity=(b.dataset.state==='uncited')?'.55':'1'; resetThread(); run(SAMPLE[b.dataset.state], b.dataset.state); });

  // new chat + toggles + theme
  $('#newChat').addEventListener('click',()=>{ renderHistory(-1); thread.innerHTML=`<div class="empty" id="empty">
    <h1>Ask your corpus anything</h1><p>Grounded, cited answers over your documents — and an honest “not in the corpus” when there’s no support.</p>
    <div class="examples"><button class="chip">How is retrieval scored?</button><button class="chip">What sets the quality bar?</button><button class="chip">What’s the capital of France?</button></div></div>`;
    document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{ composer.value=c.textContent; submit(); }));
    setReferences(null,null); });
  $('#toggleLeft').addEventListener('click',function(){ $('#sidebarLeft').classList.toggle('hide'); this.classList.toggle('on'); });
  $('#toggleRight').addEventListener('click',function(){ $('#sidebarRight').classList.toggle('hide'); this.classList.toggle('on'); });
  $('#themeToggle').addEventListener('click',()=>{ const h=document.documentElement; h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark'); });
  if(window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.setAttribute('data-theme','dark');

  // init
  renderHistory(-1); setReferences(null,null);
})();
</script>
</body>
</html>
