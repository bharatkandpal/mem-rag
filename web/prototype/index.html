<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG · design prototype</title>
<!--
  DESIGN-EVALUATION SPIKE — not the production build.
  Mock /query data, no backend. Embodies docs/ui-design-guide.md (tokens, layout,
  citation interaction, the four render branches, motion). The CSS variables + keyframes
  here port directly into the eventual React + Vite app (GO-21e, gated on RAG-63).
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ---- tokens (docs/ui-design-guide.md §3) ---- */
  :root{
    --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F4F4F5;
    --text:#18181B; --text-secondary:#52525B; --text-muted:#A1A1AA;
    --border:#E4E4E7; --accent:#4F46E5; --accent-hover:#4338CA;
    --accent-subtle:#EEF2FF; --info:#475569; --info-subtle:#F1F5F9;
    --success:#16A34A; --danger:#B91C1C; --danger-subtle:#FEF2F2;
    --shadow-sm:0 1px 2px rgba(0,0,0,.06);
    --shadow-md:0 4px 12px rgba(0,0,0,.08);
    --shadow-pop:0 8px 24px rgba(0,0,0,.12);
    --r-sm:6px; --r-md:10px; --r-lg:16px;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  [data-theme="dark"]{
    --bg:#09090B; --surface:#18181B; --surface-2:#27272A;
    --text:#FAFAFA; --text-secondary:#A1A1AA; --text-muted:#71717A;
    --border:#27272A; --accent:#6366F1; --accent-hover:#818CF8;
    --accent-subtle:rgba(99,102,241,.16); --info:#94A3B8; --info-subtle:#1E293B;
    --success:#4ADE80; --danger:#FCA5A5; --danger-subtle:rgba(239,68,68,.12);
    --shadow-md:0 4px 12px rgba(0,0,0,.4); --shadow-pop:0 8px 24px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    transition:background .3s var(--ease), color .3s var(--ease);
  }
  .app{max-width:820px; margin:0 auto; height:100vh; display:flex; flex-direction:column}

  /* ---- header ---- */
  .app-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--border);
    background:color-mix(in srgb, var(--surface) 80%, transparent);
    backdrop-filter:blur(8px); position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:-.01em}
  .logo{width:20px; height:20px; border-radius:6px; background:linear-gradient(135deg,var(--accent),var(--accent-hover)); box-shadow:var(--shadow-sm)}
  .brand small{color:var(--text-muted); font-weight:400}
  .header-actions{display:flex; align-items:center; gap:10px}
  .status-badge{
    display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:500;
    padding:5px 10px; border-radius:999px; border:1px solid var(--border);
    color:var(--text-secondary); background:var(--surface);
  }
  .status-badge .dot{width:7px; height:7px; border-radius:50%; background:var(--success);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 22%,transparent)}
  .icon-btn{
    display:grid; place-items:center; width:34px; height:34px; border-radius:var(--r-md);
    border:1px solid var(--border); background:var(--surface); color:var(--text-secondary);
    cursor:pointer; transition:transform .12s var(--ease), background .2s var(--ease), color .2s var(--ease);
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--text)}
  .icon-btn:active{transform:scale(.94)}

  /* ---- conversation ---- */
  .conversation{flex:1; overflow-y:auto; padding:24px 20px 8px; scroll-behavior:smooth}
  .msg{margin-bottom:22px}
  .msg .role{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-muted); margin-bottom:8px; display:flex; align-items:center; gap:8px}
  .role .dot{width:14px;height:14px;border-radius:5px;background:linear-gradient(135deg,var(--accent),var(--accent-hover))}
  .bubble{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:14px 16px; box-shadow:var(--shadow-sm); max-width:68ch;
  }
  .msg-user .bubble{background:var(--surface-2)}
  .answer{max-width:68ch}
  .answer .cited{
    background:linear-gradient(transparent 62%, var(--accent-subtle) 0);
    padding-bottom:1px; border-radius:2px;
  }
  sup{line-height:0}
  .cite{
    font-family:var(--mono); font-size:11px; font-weight:600; vertical-align:super;
    margin-left:2px; min-width:16px; height:16px; padding:0 4px; border-radius:5px;
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    color:var(--accent); background:var(--accent-subtle); cursor:pointer;
    transition:transform .12s var(--ease), background .15s var(--ease);
  }
  .cite:hover{background:var(--accent); color:#fff; transform:translateY(-1px)}
  .cite:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .answer-meta{display:flex; align-items:center; gap:8px; margin-top:12px}
  .grounded{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    color:var(--success); background:color-mix(in srgb,var(--success) 12%,transparent);
    padding:4px 9px; border-radius:999px;
  }

  /* ---- sources panel ---- */
  .sources{margin-top:12px; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--surface)}
  .sources-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 14px; background:var(--surface-2); border:0; cursor:pointer;
    font-family:var(--sans); font-size:13px; font-weight:600; color:var(--text-secondary);
    transition:background .2s var(--ease);
  }
  .sources-toggle:hover{background:color-mix(in srgb,var(--surface-2) 60%, var(--border))}
  .chev{transition:transform .25s var(--ease)}
  .sources[open-panel="true"] .chev{transform:rotate(90deg)}
  .sources-body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s var(--ease)}
  .sources[open-panel="true"] .sources-body{grid-template-rows:1fr}
  .sources-body > div{overflow:hidden}
  .chunk{padding:12px 14px; border-top:1px solid var(--border)}
  .chunk-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:7px}
  .chunk-src{font-family:var(--mono); font-size:12px; color:var(--text)}
  .chunk-score{font-family:var(--mono); font-size:12px; color:var(--text-muted)}
  .bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden}
  .bar > i{display:block; height:100%; width:0; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-hover));
    transition:width .7s var(--ease)}
  .chunk-text{margin-top:9px; font-family:var(--mono); font-size:12px; line-height:1.55; color:var(--text-secondary)}
  .chunk.hl{background:var(--accent-subtle)}

  /* ---- abstain / capability / error cards ---- */
  .card{border-radius:var(--r-md); padding:13px 15px; display:flex; gap:11px; align-items:flex-start; max-width:68ch}
  .card .ic{flex:none; width:20px; height:20px; margin-top:1px}
  .card-title{font-weight:600; margin-bottom:2px}
  .card-info{background:var(--info-subtle); border:1px solid color-mix(in srgb,var(--info) 30%,transparent); color:var(--text)}
  .card-info .ic{color:var(--info)}
  .card-info .card-sub{color:var(--text-secondary)}
  .card-danger{background:var(--danger-subtle); border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
  .card-danger .ic{color:var(--danger)}
  .card-danger .card-title{color:var(--danger)}
  .card .trace{font-family:var(--mono); font-size:12px; color:var(--text-muted); margin-top:6px}
  .capability-note{margin-top:12px; font-size:13px; color:var(--info);
    display:flex; align-items:center; gap:7px}

  /* ---- loading ---- */
  .thinking{display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:14px}
  .dots{display:inline-flex; gap:4px}
  .dots i{width:6px; height:6px; border-radius:50%; background:var(--text-muted); animation:bounce 1.2s var(--ease) infinite}
  .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
  .skeleton{margin-top:10px; height:12px; border-radius:6px; max-width:60ch;
    background:linear-gradient(90deg,var(--surface-2) 25%, color-mix(in srgb,var(--surface-2) 40%,var(--border)) 37%, var(--surface-2) 63%);
    background-size:400% 100%; animation:shimmer 1.4s ease infinite}
  .skeleton.s2{max-width:52ch; margin-top:8px} .skeleton.s3{max-width:38ch; margin-top:8px}
  .caret{display:inline-block; width:2px; height:1.05em; background:var(--accent); vertical-align:-2px; margin-left:2px; animation:blink 1s steps(1) infinite}

  /* ---- empty state ---- */
  .empty{text-align:center; margin:8vh auto 0; max-width:520px; animation:rise .4s var(--ease) both}
  .empty h1{font-size:26px; letter-spacing:-.02em; margin:0 0 8px}
  .empty p{color:var(--text-secondary); margin:0 0 22px}
  .examples{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  .chip{font-size:13px; padding:9px 13px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-secondary); cursor:pointer;
    transition:transform .12s var(--ease), border-color .2s var(--ease), color .2s var(--ease)}
  .chip:hover{border-color:var(--accent); color:var(--text); transform:translateY(-1px)}

  /* ---- composer ---- */
  .composer-wrap{border-top:1px solid var(--border); padding:14px 20px 18px; background:var(--bg)}
  .demo-toolbar{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
  .demo-toolbar span{font-size:12px; color:var(--text-muted)}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--surface)}
  .seg button{font-family:var(--sans); font-size:12px; padding:6px 11px; border:0; background:transparent;
    color:var(--text-secondary); cursor:pointer; transition:background .2s var(--ease), color .2s var(--ease)}
  .seg button + button{border-left:1px solid var(--border)}
  .seg button.active{background:var(--accent); color:#fff}
  .composer{display:flex; gap:10px; align-items:flex-end}
  .composer textarea{
    flex:1; resize:none; font-family:var(--sans); font-size:15px; line-height:1.5; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
    padding:12px 14px; min-height:48px; max-height:140px; outline:none;
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .composer textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-subtle)}
  .ask{
    display:inline-flex; align-items:center; gap:7px; font-family:var(--sans); font-weight:600; font-size:14px;
    padding:12px 18px; border-radius:var(--r-md); border:0; cursor:pointer; color:#fff;
    background:var(--accent); box-shadow:var(--shadow-sm);
    transition:transform .12s var(--ease), background .2s var(--ease);
  }
  .ask:hover{background:var(--accent-hover)} .ask:active{transform:scale(.96)}
  .ask:disabled{opacity:.5; cursor:default}
  .hint{margin-top:8px; font-size:12px; color:var(--text-muted); text-align:right}
  kbd{font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:4px; padding:1px 5px}

  /* ---- popover ---- */
  .popover{
    position:fixed; z-index:20; max-width:320px; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow-pop);
    padding:12px 14px; opacity:0; transform:scale(.94) translateY(4px); pointer-events:none;
    transition:opacity .15s var(--ease), transform .15s var(--ease);
  }
  .popover.show{opacity:1; transform:scale(1) translateY(0); pointer-events:auto}
  .popover .pv-src{font-family:var(--mono); font-size:11px; color:var(--accent); margin-bottom:6px}
  .popover .pv-quote{font-size:13px; line-height:1.5; color:var(--text-secondary)}
  .popover .pv-quote::before{content:'“'} .popover .pv-quote::after{content:'”'}

  /* ---- entrance animation ---- */
  .enter{animation:rise .32s var(--ease) both}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.5} 30%{transform:translateY(-5px); opacity:1}}
  @keyframes shimmer{0%{background-position:100% 0} 100%{background-position:0 0}}
  @keyframes blink{50%{opacity:0}}

  @media (max-width:600px){ .app{max-width:100%} .hint{display:none} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
    .caret{animation:none}
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand"><span class="logo"></span> RAG <small>· knowledge-store chat</small></div>
    <div class="header-actions">
      <span class="status-badge" id="statusBadge"><span class="dot"></span> citations on · claude-opus-4-8</span>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <main class="conversation" id="conversation" aria-live="polite">
    <div class="empty" id="empty">
      <h1>Ask your corpus anything</h1>
      <p>Grounded, cited answers over your documents — and an honest “not in the corpus” when there’s no support.</p>
      <div class="examples">
        <button class="chip">How is retrieval scored?</button>
        <button class="chip">What sets the quality bar?</button>
        <button class="chip">What’s the capital of France?</button>
      </div>
    </div>
  </main>

  <div class="composer-wrap">
    <div class="demo-toolbar">
      <span>Preview state:</span>
      <div class="seg" id="seg">
        <button data-state="grounded" class="active">Grounded</button>
        <button data-state="abstain">Abstain</button>
        <button data-state="uncited">Uncited</button>
        <button data-state="error">Error</button>
      </div>
    </div>
    <div class="composer">
      <textarea id="composer" rows="1" placeholder="Ask a question about the corpus…"></textarea>
      <button class="ask" id="ask">Ask →</button>
    </div>
    <div class="hint"><kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>Enter</kbd> to send</div>
  </div>
</div>

<div class="popover" id="popover" role="tooltip">
  <div class="pv-src" id="pvSrc"></div>
  <div class="pv-quote" id="pvQuote"></div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const conv = $('#conversation'), empty = $('#empty'), composer = $('#composer'),
        ask = $('#ask'), popover = $('#popover'), badge = $('#statusBadge');

  // ---- mock /query responses (the four QueryResult render branches) ----
  const CHUNKS = [
    {source:'TDD.md', score:0.71, content:'embed(query) → pgvector cosine search top-k → return {content, source, score}. k and a min-score floor are config.'},
    {source:'GO-21.md', score:0.58, content:'Retrieval: top-k similarity search (HNSW) with metadata + score. A query returns the relevant chunks with sources, ranked.'},
    {source:'.claude/rules/ai-and-secrets.md', score:0.42, content:'Abstain on empty retrieval. If no chunk clears the score floor, return "not in the corpus" — never free-generate an answer.'}
  ];
  const GROUNDED = {
    abstained:false, citationsSupported:true, chunks:CHUNKS,
    answerHTML:
      'Retrieval scores each chunk by <span class="cited">cosine similarity over an HNSW index<sup><button class="cite" data-idx="0">1</button></sup></span>, '+
      'then applies a <span class="cited">configurable min-score floor<sup><button class="cite" data-idx="1">2</button></sup></span> so weak matches drop out. '+
      'Chunks that clear the floor are ranked by score and passed to generation; if none clear it, the system '+
      '<span class="cited">abstains rather than answer ungrounded<sup><button class="cite" data-idx="2">3</button></sup></span>.',
    citations:[
      {documentIndex:0, source:'TDD.md', citedText:'embed(query) → pgvector cosine search top-k over the HNSW index.'},
      {documentIndex:0, source:'TDD.md', citedText:'k and a min-score floor are config (RAG-22, MIN_SCORE).'},
      {documentIndex:2, source:'.claude/rules/ai-and-secrets.md', citedText:'If no chunk clears the score floor, return "not in the corpus" — never free-generate.'}
    ]
  };
  const UNCITED = {
    abstained:false, citationsSupported:false, chunks:CHUNKS, citations:[],
    answerHTML:'Retrieval ranks chunks by cosine similarity over the HNSW index and drops anything below the min-score floor before generation.'
  };
  const ABSTAIN = { abstained:true, citationsSupported:true, chunks:[], citations:[],
    answer:"I don’t have that in the corpus." };
  const ERROR = { error:true, correlationId:'req_8f2a…c7' };

  function pickState(text){
    const t=(text||'').toLowerCase();
    if(/capital|france|weather|stock/.test(t)) return 'abstain';
    if(/error|fail|500/.test(t)) return 'error';
    return 'grounded';
  }
  const STATES = {grounded:GROUNDED, uncited:UNCITED, abstain:ABSTAIN, error:ERROR};

  // ---- rendering ----
  function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
  function scrollDown(){ conv.scrollTop = conv.scrollHeight; }

  function addUser(text){
    empty && empty.remove();
    const m = el(`<div class="msg msg-user enter"><div class="role">You</div><div class="bubble">${escapeHtml(text)}</div></div>`);
    conv.appendChild(m); scrollDown();
  }
  function escapeHtml(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  function addLoading(){
    const m = el(`<div class="msg msg-assistant enter" id="loading">
      <div class="role"><span class="dot"></span> RAG</div>
      <div class="bubble">
        <div class="thinking">retrieving &amp; generating <span class="dots"><i></i><i></i><i></i></span></div>
        <div class="skeleton"></div><div class="skeleton s2"></div><div class="skeleton s3"></div>
      </div></div>`);
    conv.appendChild(m); scrollDown(); return m;
  }

  function chunkRow(c, idx){
    return `<div class="chunk" data-chunk="${idx}">
      <div class="chunk-head"><span class="chunk-src">${escapeHtml(c.source)}</span><span class="chunk-score">${c.score.toFixed(2)}</span></div>
      <div class="bar"><i data-w="${Math.round(c.score*100)}"></i></div>
      <div class="chunk-text">${escapeHtml(c.content)}</div></div>`;
  }

  function renderAssistant(state){
    const d = STATES[state];
    let inner='';
    if(state==='error'){
      inner = `<div class="card card-danger">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <div><div class="card-title">Something went wrong</div>
        <div class="card-sub">The query couldn’t be completed. Please retry.</div>
        <div class="trace">trace id: ${d.correlationId}</div></div></div>`;
    } else if(state==='abstain'){
      inner = `<div class="card card-info">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
        <div><div class="card-title">Not in the corpus</div>
        <div class="card-sub">${escapeHtml(d.answer)}</div></div></div>`;
    } else {
      const grounded = d.citations.length>0;
      const sources = d.chunks.length ? `
        <div class="sources" open-panel="false">
          <button class="sources-toggle"><span>▸ Sources (${d.chunks.length})</span><span class="chev">›</span></button>
          <div class="sources-body"><div>${d.chunks.map(chunkRow).join('')}</div></div>
        </div>` : '';
      const meta = grounded
        ? `<div class="answer-meta"><span class="grounded">✓ grounded · ${d.citations.length} citations</span></div>`
        : (d.citationsSupported===false
            ? `<div class="capability-note">ⓘ configured generation provider does not support citations</div>` : '');
      inner = `<div class="answer">${d.answerHTML}<span class="caret" id="caret"></span></div>${meta}${sources}`;
    }
    const m = el(`<div class="msg msg-assistant enter"><div class="role"><span class="dot"></span> RAG</div><div class="bubble">${inner}</div></div>`);
    conv.appendChild(m);

    // stash citations for popovers
    if(state==='grounded') m._citations = d.citations;
    // animate score bars + wire panel/citations after paint
    requestAnimationFrame(()=>{
      m.querySelectorAll('.bar > i').forEach(b=>{ b.style.width = b.dataset.w + '%'; });
      const caret = m.querySelector('#caret'); if(caret) setTimeout(()=>caret.remove(), 1400);
      wire(m);
    });
    scrollDown();
  }

  function wire(m){
    const panel = m.querySelector('.sources');
    if(panel){
      panel.querySelector('.sources-toggle').addEventListener('click', ()=>{
        panel.setAttribute('open-panel', panel.getAttribute('open-panel')==='true' ? 'false':'true');
      });
    }
    m.querySelectorAll('.cite').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const c = m._citations[+btn.dataset.idx];
        showPopover(btn, c);
        // open panel + highlight the matching chunk
        if(panel){
          panel.setAttribute('open-panel','true');
          panel.querySelectorAll('.chunk').forEach(x=>x.classList.remove('hl'));
          const row = panel.querySelector(`.chunk[data-chunk="${c.documentIndex}"]`);
          if(row){ row.classList.add('hl'); row.scrollIntoView({block:'nearest', behavior:'smooth'}); }
        }
      });
    });
  }

  function showPopover(anchor, c){
    $('#pvSrc').textContent = c.source;
    $('#pvQuote').textContent = c.citedText;
    const r = anchor.getBoundingClientRect();
    popover.classList.add('show');
    const pw = popover.offsetWidth, ph = popover.offsetHeight;
    let left = Math.min(Math.max(8, r.left + r.width/2 - pw/2), window.innerWidth - pw - 8);
    let top = r.top - ph - 8; if(top < 8) top = r.bottom + 8;
    popover.style.left = left+'px'; popover.style.top = top+'px';
  }
  document.addEventListener('click', e=>{ if(!e.target.closest('.cite') && !e.target.closest('.popover')) popover.classList.remove('show'); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') popover.classList.remove('show'); });

  // ---- flow ----
  let forced = 'grounded';
  function run(text, state){
    ask.disabled = true;
    if(text) addUser(text);
    const loading = addLoading();
    setTimeout(()=>{ loading.remove(); renderAssistant(state); ask.disabled=false; }, 950);
  }

  function submit(){
    const text = composer.value.trim(); if(!text) return;
    composer.value=''; autosize();
    run(text, pickState(text));
  }
  ask.addEventListener('click', submit);
  composer.addEventListener('keydown', e=>{
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); submit(); }
  });
  function autosize(){ composer.style.height='auto'; composer.style.height=Math.min(composer.scrollHeight,140)+'px'; }
  composer.addEventListener('input', autosize);

  // example chips
  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{ composer.value=c.textContent; submit(); }));

  // preview-state segmented control → render a canned exchange
  const SAMPLE = {grounded:'How is retrieval scored?', uncited:'How is retrieval scored?', abstain:"What’s the capital of France?", error:'trigger an error'};
  $('#seg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    forced = b.dataset.state;
    badge.style.opacity = (forced==='uncited') ? '.55' : '1';
    run(SAMPLE[forced], forced);
  });

  // theme toggle
  $('#themeToggle').addEventListener('click', ()=>{
    const html=document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme')==='dark'?'light':'dark');
  });
  if(window.matchMedia && matchMedia('(prefers-color-scheme:dark)').matches)
    document.documentElement.setAttribute('data-theme','dark');
})();
</script>
</body>
</html>
