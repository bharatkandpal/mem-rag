# One-command run (PRD FR-7): `docker compose up` → app + pgvector live.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      PORT: 3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
      RETRIEVAL_K: ${RETRIEVAL_K:-5}
      MIN_SCORE: ${MIN_SCORE:-0.3}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-anthropic}
      GENERATION_MODEL: ${GENERATION_MODEL:-claude-opus-4-8}
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./eval/sample-corpus:/app/eval/sample-corpus:ro
      # Live-editable chat UI: edit web/public + restart the app, no rebuild.
      - ./web/public:/app/web/public:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
